#err{color:#e05d5d;font-size:13px;min-height:18px;margin-top:10px}

const LS_KEY = "dashKey_" + "0b56d0fbcd5fea2ed886c4ea65d8736e".slice(0, 12);
function hex2u8(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function u8hex(a){return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("");}
function b642u8(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function deriveKey(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},true,["decrypt"]);
}
async function tryOpen(key){
  const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:NONCE},key,b642u8(CT_B64));
  const ds=new DecompressionStream("gzip");
  const buf=await new Response(new Blob([gz]).stream().pipeThrough(ds)).arrayBuffer();
  const html=new TextDecoder().decode(buf);
  // document.write()整份覆寫=瀏覽器視同重新解析文件,dashboard.html自帶的viewport meta會正確生效
  // (2026-08-11修正: 先前改用blob:網址導頁在iOS上會在背景回收記憶體後失效→分頁整個壞掉,
  //  blob網址只活在建立它的分頁記憶體裡、不支援重新載入,遠比document.write()脆弱,改回原生寫法)
  document.open();document.write(html);document.close();
}
async function unlock(){
  const btn=document.getElementById("go"),err=document.getElementById("err"),
        spin=document.getElementById("spin"),pw=document.getElementById("pw").value;
  if(!pw)return;
  btn.disabled=true;err.textContent="";spin.textContent="驗證中…(首次約1-3秒)";
  try{
    const key=await deriveKey(pw);
    if(document.getElementById("rem").checked){
      try{const raw=await crypto.subtle.exportKey("raw",key);
          localStorage.setItem(LS_KEY,u8hex(new Uint8Array(raw)));}catch(e){}
    }
    await tryOpen(key);
  }catch(e){
    err.textContent="密碼不對";spin.textContent="";btn.disabled=false;
    localStorage.removeItem(LS_KEY);
  }
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
(async function(){
  const h=localStorage.getItem(LS_KEY);
  if(!h)return;
  try{
    const key=await crypto.subtle.importKey("raw",hex2u8(h),{name:"AES-GCM"},true,["decrypt"]);
    document.getElementById("spin").textContent="自動解鎖中…";
    await tryOpen(key);
  }catch(e){localStorage.removeItem(LS_KEY);document.getElementById("spin").textContent="";}
})();
